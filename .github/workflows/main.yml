name: TaroTR

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tarotr:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "=== TaroTR Windows Runner ==="
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          node --version 2>$null
          npm --version 2>$null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check Project
        shell: powershell
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json tidak ditemukan."
            exit 1
          }

      - name: Install Dependencies
        shell: powershell
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

      - name: Build TaroTR
        shell: powershell
        run: |
          npm run build

      - name: Test TaroTR
        shell: powershell
        run: |
          npm test --if-present

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "Gagal mengunduh Tailscale."
            exit 1
          }

          Start-Process msiexec.exe `
            -ArgumentList "/i", $installer, "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            Write-Error "Tailscale tidak ditemukan."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "Secret TAILSCALE_AUTH_KEY belum dibuat."
            exit 1
          }

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="tarotr-$env:GITHUB_RUN_ID"

      - name: Show Tailscale Address
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Tailscale address tidak ditemukan."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " TaroTR ADDRESS: $ip"
          Write-Host "=========================================="

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaroTR-build
          path: |
            dist/**
            build/**
          if-no-files-found: ignore
          retention-days: 7
