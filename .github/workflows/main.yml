name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "======================================"
          Write-Host "       ESTABLISH TAILSCALE"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret belum tersedia."
            exit 1
          }

          $tsExe = $null

          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $tsExe = $path
              break
            }
          }

          if (-not $tsExe) {
            $command = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($command) {
              $tsExe = $command.Source
            }
          }

          if (-not $tsExe) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          Write-Host "Tailscale: $tsExe"

          $service = Get-Service -Name Tailscale -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "Tailscale service: $($service.Status)"

            if ($service.Status -ne 'Running') {
              Start-Service -Name Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
              $service.Refresh()
              Write-Host "Tailscale service: $($service.Status)"
            }
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          & $tsExe version

          Write-Host ""
          Write-Host "Connecting to Tailscale..."

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          $upOutput = & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" 2>&1

          $upExitCode = $LASTEXITCODE

          if ($upOutput) {
            $upOutput | ForEach-Object {
              Write-Host $_
            }
          }

          Write-Host "tailscale up exit code: $upExitCode"

          if ($upExitCode -ne 0) {
            Write-Error "tailscale up gagal."
            exit 1
          }

          Write-Host ""
          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null
          $maxRetries = 60

          for ($i = 1; $i -le $maxRetries; $i++) {

            Write-Host "Attempt $i/$maxRetries"

            try {
              $ipOutput = & $tsExe ip -4 2>&1

              if ($LASTEXITCODE -eq 0 -and $ipOutput) {

                foreach ($line in $ipOutput) {

                  $lineText = "$line".Trim()

                  if ($lineText -match '^\d{1,3}(\.\d{1,3}){3}$') {
                    $tsIP = $lineText
                    break
                  }
                }
              }
            }
            catch {
              Write-Host "IP query failed: $($_.Exception.Message)"
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {

            Write-Host ""
            Write-Host "======================================"
            Write-Host "TAILSCALE DEBUG"
            Write-Host "======================================"

            Write-Host ""
            Write-Host "Tailscale status:"

            try {
              & $tsExe status
            }
            catch {
              Write-Host "status failed: $($_.Exception.Message)"
            }

            Write-Host ""
            Write-Host "Tailscale netcheck:"

            try {
              & $tsExe netcheck
            }
            catch {
              Write-Host "netcheck failed: $($_.Exception.Message)"
            }

            Write-Host ""
            Write-Host "======================================"

            Write-Error "Tailscale IP tidak berhasil diperoleh."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Tailscale connection established"
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Hostname: $hostname"
          Write-Host "======================================"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "       VERIFY RDP ACCESSIBILITY"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Write-Error "TAILSCALE_IP tidak tersedia."
            exit 1
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "TCP connection ke $env:TAILSCALE_IP`:3389 gagal."
            exit 1
          }

          Write-Host "TCP connectivity successful."

      - name: RDP Status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP STATUS"
          Write-Host "======================================"

          $service = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "TermService: $($service.Status)"
          }
          else {
            Write-Host "TermService: NOT FOUND"
          }

          $regPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'

          $reg = Get-ItemProperty `
            -Path $regPath `
            -Name fDenyTSConnections `
            -ErrorAction SilentlyContinue

          if ($reg) {
            Write-Host "fDenyTSConnections: $($reg.fDenyTSConnections)"
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Write-Host "======================================"
          Write-Host "RDP verification complete."
