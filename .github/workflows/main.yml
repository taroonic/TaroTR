name: RDP Status Check

on:
  workflow_dispatch:

jobs:
  rdp-check:
    runs-on: windows-latest

    steps:
      - name: Verify and Report RDP Status
        shell: pwsh
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          Write-Host "=== Verify and Report RDP Status ==="

          $results = [System.Collections.Generic.List[object]]::new()

          function Add-Result {
            param(
              [string]$Name,
              [bool]$Passed,
              [string]$Message
            )

            $results.Add([PSCustomObject]@{
              name = $Name
              passed = $Passed
              message = $Message
            })

            if ($Passed) {
              Write-Host "[PASS] $Name - $Message"
            } else {
              Write-Host "[FAIL] $Name - $Message"
            }
          }

          # RDP Service
          $service = Get-Service -Name TermService -ErrorAction SilentlyContinue

          if ($service -and $service.Status -eq "Running") {
            Add-Result "RDP Service" $true "Running"
          } else {
            Add-Result "RDP Service" $false "TermService tidak berjalan atau tidak ditemukan"
          }

          # RDP Registry
          $reg = Get-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -ErrorAction SilentlyContinue

          if ($reg -and $reg.fDenyTSConnections -eq 0) {
            Add-Result "RDP Registry" $true "fDenyTSConnections=0"
          } else {
            Add-Result "RDP Registry" $false "RDP registry belum aktif"
          }

          # RDP User
          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($user -and $user.Enabled) {
            Add-Result "RDP User" $true "RDP account exists and enabled"
          } else {
            Add-Result "RDP User" $false "RDP account tidak ditemukan atau disabled"
          }

          # Local port
          $port = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($port.TcpTestSucceeded) {
            Add-Result "RDP Port" $true "127.0.0.1:3389 reachable"
          } else {
            Add-Result "RDP Port" $false "127.0.0.1:3389 tidak dapat diakses"
          }

          # Tailscale IP
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Add-Result "Tailscale IP" $false "TAILSCALE_IP belum diatur"
          } else {
            Add-Result "Tailscale IP" $true "IP=$env:TAILSCALE_IP"
          }

          # Summary
          Write-Host ""
          Write-Host "========== SUMMARY =========="

          foreach ($r in $results) {
            $status = if ($r.passed) { "PASS" } else { "FAIL" }
            Write-Host "$($r.name): $status - $($r.message)"
          }

          $failed = @($results | Where-Object { -not $_.passed })

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "RDP CHECK FAILED"
            exit 1
          }

          Write-Host ""
          Write-Host "ALL CHECKS PASSED"
