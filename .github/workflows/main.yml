name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "       CONFIGURE RDP SETTINGS"
          Write-Host "======================================"

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          Write-Host "RDP registry configured."
          Write-Host "TermService configured."

      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "          CONFIGURE RDP USER"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "Secret RDP_PASSWORD belum dibuat."
            exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser `
              -Name 'RDP' `
              -Password $securePassword

            Enable-LocalUser `
              -Name 'RDP'

            Write-Host "RDP user already existed; password updated."
          }
          else {
            New-LocalUser `
              -Name 'RDP' `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires:$false `
              -UserMayNotChangePassword:$false

            Write-Host "RDP user created."
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'RDP' `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured successfully."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msi = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $msi

          if (-not (Test-Path $msi)) {
            Write-Error "Tailscale MSI gagal didownload."
            exit 1
          }

          $process = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Write-Error "Instalasi Tailscale gagal: $($process.ExitCode)"
            exit 1
          }

          Write-Host "Tailscale installed."

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "TAILSCALE_AUTH_KEY belum dibuat."
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          $service = Get-Service `
            -Name Tailscale `
            -ErrorAction SilentlyContinue

          if ($service -and $service.Status -ne 'Running') {
            Start-Service -Name Tailscale
            Start-Sleep -Seconds 5
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale gagal terhubung."
            exit 1
          }

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {
            $output = & $tsExe ip -4 2>&1

            if ($LASTEXITCODE -eq 0) {
              foreach ($line in $output) {
                $candidate = "$line".Trim()

                if ($candidate -match '^100\.(\d{1,3}\.){2}\d{1,3}$') {
                  $tsIP = $candidate
                  break
                }
              }
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            Write-Host "Tailscale status:"
            & $tsExe status

            Write-Error "Tailscale IP tidak diperoleh."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "       VERIFY RDP ACCESSIBILITY"
          Write-Host "======================================"

          $service = Get-Service `
            -Name TermService `
            -ErrorAction Stop

          if ($service.Status -ne 'Running') {
            Write-Error "TermService tidak berjalan."
            exit 1
          }

          $reg = Get-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections

          if ($reg.fDenyTSConnections -ne 0) {
            Write-Error "RDP masih disabled."
            exit 1
          }

          $port = Test-NetConnection `
            -ComputerName '127.0.0.1' `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $port.TcpTestSucceeded) {
            Write-Error "Port 3389 tidak aktif."
            exit 1
          }

          Write-Host "RDP service: OK"
          Write-Host "RDP registry: OK"
          Write-Host "RDP port 3389: OK"

          if ($env:TAILSCALE_IP) {
            Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          }

      - name: Final Status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP STATUS"
          Write-Host "======================================"
          Write-Host "RDP Service : $((Get-Service TermService).Status)"
          Write-Host "RDP Port    : 3389"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "======================================"
          Write-Host "RDP CHECK COMPLETE"
