name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host " CREATE RDP USER WITH SECURE PASSWORD"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret belum dibuat."
          }

          if ($env:RDP_PASSWORD.Length -lt 8) {
            throw "RDP_PASSWORD minimal 8 karakter."
          }

          # Enable RDP
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

          Set-ItemProperty `
            -Path $rdpPath `
            -Name "fDenyTSConnections" `
            -Value 0

          # Enable RDP firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Start RDP service
          $termService = Get-Service `
            -Name "TermService" `
            -ErrorAction Stop

          if ($termService.Status -ne "Running") {
            Start-Service -Name "TermService"
          }

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          # Password
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $username = "RDP"

          # Create or update user
          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Enable-LocalUser `
              -Name $username
          }
          else {
            Write-Host "Creating RDP user..."

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "Temporary RDP account"

            Enable-LocalUser `
              -Name $username
          }

          # Add user to Remote Desktop Users
          $members = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue

          $alreadyMember = $members | Where-Object {
            $_.Name -eq $username -or
            $_.Name -like "*\$username"
          }

          if (-not $alreadyMember) {
            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $username
          }

          # Verify user
          $verifyUser = Get-LocalUser `
            -Name $username `
            -ErrorAction Stop

          if (-not $verifyUser.Enabled) {
            throw "RDP user gagal diaktifkan."
          }

          Write-Host ""
          Write-Host "RDP USER READY"
          Write-Host "Username: RDP"
          Write-Host "Password: [HIDDEN]"
          Write-Host "Enabled : $($verifyUser.Enabled)"


      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "======================================"
          Write-Host "          INSTALL TAILSCALE"
          Write-Host "======================================"

          $msi = Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          if (-not (Test-Path $msi)) {
            throw "Tailscale MSI gagal didownload."
          }

          Write-Host "Installing Tailscale..."

          $install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              $msi
              "/qn"
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($install.ExitCode -ne 0) {
            throw "Instalasi Tailscale gagal. Exit code: $($install.ExitCode)"
          }

          $tsExe = Join-Path `
            $env:ProgramFiles `
            "Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            $cmd = Get-Command `
              "tailscale.exe" `
              -ErrorAction SilentlyContinue

            if ($cmd) {
              $tsExe = $cmd.Source
            }
          }

          if (-not $tsExe -or -not (Test-Path $tsExe)) {
            throw "tailscale.exe tidak ditemukan setelah instalasi."
          }

          Write-Host "Using: $tsExe"

          "TAILSCALE_EXE=$tsExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          & $tsExe version


      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "      ESTABLISH TAILSCALE CONNECTION"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret belum dibuat."
          }

          $tsExe = $env:TAILSCALE_EXE

          if (-not $tsExe -or -not (Test-Path $tsExe)) {
            throw "Tailscale executable tidak ditemukan."
          }

          # Make sure service is running
          $service = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "Tailscale service: $($service.Status)"

            if ($service.Status -ne "Running") {
              Start-Service `
                -Name "Tailscale" `
                -ErrorAction Stop

              Start-Sleep -Seconds 5
            }
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          & $tsExe version

          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          Write-Host ""
          Write-Host "Connecting..."

          $output = & $tsExe up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" `
            "--accept-dns=false" `
            2>&1

          $exitCode = $LASTEXITCODE

          if ($output) {
            $output | ForEach-Object {
              Write-Host $_
            }
          }

          Write-Host "tailscale up exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Tailscale gagal terhubung. Periksa TAILSCALE_AUTH_KEY."
          }

          Write-Host "Tailscale up berhasil."

          # Wait for Tailscale IP
          $tsIP = $null

          for ($i = 1; $i -le 60; $i++) {

            Write-Host "Waiting for Tailscale IP: $i/60"

            $ipOutput = & $tsExe ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $ipOutput) {

              foreach ($line in $ipOutput) {

                $candidate = "$line".Trim()

                if ($candidate -match '^100\.(\d{1,3}\.){2}\d{1,3}$') {
                  $tsIP = $candidate
                  break
                }
              }
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {

            Write-Host ""
            Write-Host "========== TAILSCALE STATUS =========="

            & $tsExe status

            Write-Host "======================================="

            throw "Tailscale IP tidak berhasil diperoleh."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Tailscale connected successfully."
          Write-Host "IP: $tsIP"
          Write-Host "======================================"


      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "       VERIFY RDP ACCESSIBILITY"
          Write-Host "======================================"

          # Check RDP service
          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction Stop

          if ($service.Status -ne "Running") {
            throw "TermService tidak berjalan."
          }

          # Check registry
          $rdpReg = Get-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -ErrorAction Stop

          if ($rdpReg.fDenyTSConnections -ne 0) {
            throw "RDP masih disabled."
          }

          # Check Tailscale IP
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            throw "TAILSCALE_IP tidak tersedia."
          }

          Write-Host "Testing $env:TAILSCALE_IP`:3389"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            throw "TCP connection ke RDP port 3389 gagal."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       RDP ACCESSIBILITY: SUCCESS"
          Write-Host "======================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: [HIDDEN]"
          Write-Host "======================================"


      - name: Maintain Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP ACCESS ACTIVE"
          Write-Host "======================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: [HIDDEN]"
          Write-Host "======================================"
          Write-Host ""

          Write-Host "RDP Active."
          Write-Host "Keep this workflow running while you use the session."

          while ($true) {

            $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$now] RDP Active - $env:TAILSCALE_IP`:3389"

            Start-Sleep -Seconds 300
          }
