- name: Create RDP User with Secure Password
  shell: pwsh
  env:
    RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
  run: |
    $ErrorActionPreference = 'Stop'

    Write-Host "=== CREATE RDP USER ==="

    if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
      Write-Error "RDP_PASSWORD belum dibuat di GitHub Secrets."
      exit 1
    }

    if ($env:RDP_PASSWORD.Length -lt 12) {
      Write-Error "Password harus minimal 12 karakter."
      exit 1
    }

    $securePassword = ConvertTo-SecureString `
      $env:RDP_PASSWORD `
      -AsPlainText `
      -Force

    $user = Get-LocalUser `
      -Name "RDP" `
      -ErrorAction SilentlyContinue

    if ($null -eq $user) {

      New-LocalUser `
        -Name "RDP" `
        -Password $securePassword `
        -AccountNeverExpires

      Write-Host "Username RDP berhasil dibuat."

    }
    else {

      Set-LocalUser `
        -Name "RDP" `
        -Password $securePassword

      Enable-LocalUser `
        -Name "RDP"

      Write-Host "Username RDP sudah ada, password diperbarui."
    }

    Add-LocalGroupMember `
      -Group "Remote Desktop Users" `
      -Member "RDP" `
      -ErrorAction SilentlyContinue

    Write-Host "Username : RDP"
    Write-Host "Password : [TERSIMPAN DI GITHUB SECRET]"
    Write-Host "RDP user siap."
