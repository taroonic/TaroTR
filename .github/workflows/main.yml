name: Create RDP User with Secure Password

on:
  push:
    branches: [ main ]

jobs:
  create-rdp:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}  # ← Nama secret yang valid
        run: |
          $ErrorActionPreference = 'Stop'
          
          Write-Host "======================================"
          Write-Host "          CREATE RDP USER"
          Write-Host "======================================"
          
          $username = "RDP"
          
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD secret belum tersedia."
            exit 1
          }
          
          if ($env:RDP_PASSWORD.Length -lt 8) {
            Write-Error "RDP_PASSWORD minimal 8 karakter."
            exit 1
          }
          
          # ... rest of script remains the same ...
