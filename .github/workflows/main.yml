# TaroTR Windows Tailscale Runner

```yaml
name: TaroTR

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i", $installer, "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale tidak ditemukan."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Secret TAILSCALE_AUTH_KEY belum dibuat."
          }

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

      - name: Show Tailscale Address
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IP tidak ditemukan."
          }

          Write-Host "================================"
          Write-Host "Tailscale Address: $ip"
          Write-Host "================================"

      - name: Keep Runner Active
        shell: powershell
        run: |
          Write-Host "Runner aktif."
          Start-Sleep -Seconds 60
```
