```yaml
name: TaroTR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Windows Runner
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host " TaroTR Windows Runner"
          Write-Host "================================="
          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "User     : $env:USERNAME"
          Write-Host "Windows  : $([Environment]::OSVersion.Version)"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "Tailscale installer gagal didownload."
            exit 1
          }

          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe `
            -ArgumentList "/i", $installer, "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            Write-Error "Tailscale tidak ditemukan."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "Secret TAILSCALE_AUTH_KEY belum dibuat."
            exit 1
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="tarotr-$env:GITHUB_RUN_ID"

      - name: Get Tailscale Address
        shell: powershell
        run: |
          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Tailscale IP tidak ditemukan."
            exit 1
          }

          Write-Host ""
          Write-Host "================================="
          Write-Host " Tailscale Address: $ip"
          Write-Host "================================="

      - name: Show Tailscale Status
        shell: powershell
        run: |
          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscale status

      - name: Finish
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "TaroTR workflow selesai."
```
