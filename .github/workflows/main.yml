name: Build TaroTR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check project
        run: |
          test -f package.json || {
            echo "package.json tidak ditemukan"
            exit 1
          }

          echo "Project ditemukan:"
          cat package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build TaroTR
        run: npm run build

      - name: Verify build
        run: |
          if [ -d "dist" ]; then
            echo "Build ditemukan di dist/"
            find dist -maxdepth 2 -type f | head -50
          elif [ -d "build" ]; then
            echo "Build ditemukan di build/"
            find build -maxdepth 2 -type f | head -50
          else
            echo "ERROR: hasil build tidak ditemukan."
            exit 1
          fi

      - name: Run tests
        run: npm test --if-present

      - name: Upload TaroTR
        uses: actions/upload-artifact@v4
        with:
          name: TaroTR
          path: |
            dist/**
            build/**
          if-no-files-found: error
          retention-days: 7
