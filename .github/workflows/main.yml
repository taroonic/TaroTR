- name: Verify and Report RDP Status
  shell: pwsh
  env:
    # optional fallback; can be set from secrets or left empty if tailscale CLI available
    TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
  run: |
    Write-Host "=== Verify and Report RDP Status ==="

    $results = @()

    function Add-Result($name, $passed, $message) {
      $results += [PSCustomObject]@{ name = $name; passed = [bool]$passed; message = $message }
      if ($passed) { Write-Host "✓ $name: $message" } else { Write-Host "✗ $name: $message" }
    }

    # 1) RDP service
    $rdpService = Get-Service -Name TermService -ErrorAction SilentlyContinue
    if (-not $rdpService) {
      Add-Result "RDP Service" $false "TermService tidak ditemukan"
    } elseif ($rdpService.Status -ne 'Running') {
      Add-Result "RDP Service" $false "Status: $($rdpService.Status)"
    } else {
      Add-Result "RDP Service" $true "Running"
    }

    # 2) Registry fDenyTSConnections
    $fDenyObj = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -ErrorAction SilentlyContinue
    if (-not $fDenyObj -or $null -eq $fDenyObj.fDenyTSConnections) {
      Add-Result "Remote Desktop Registry" $false "Nilai registry tidak ditemukan"
    } elseif ($fDenyObj.fDenyTSConnections -ne 0) {
      Add-Result "Remote Desktop Registry" $false "fDenyTSConnections=$($fDenyObj.fDenyTSConnections) (expected 0)"
    } else {
      Add-Result "Remote Desktop Registry" $true "fDenyTSConnections=0"
    }

    # 3) Local user RDP exists and enabled
    $rdpUser = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue
    if (-not $rdpUser) {
      Add-Result "RDP User Account" $false "Account 'RDP' tidak ditemukan"
    } elseif ($rdpUser.Enabled -ne $true) {
      Add-Result "RDP User Account" $false "Account ditemukan tapi disabled"
    } else {
      Add-Result "RDP User Account" $true "Exists and enabled"
    }

    # 4) Membership in Remote Desktop Users
    $inGroup = $false
    $members = Get-LocalGroupMember -Group 'Remote Desktop Users' -ErrorAction SilentlyContinue
    if ($members) {
      if ($members | Where-Object { $_.Name -eq 'RDP' -or $_.Name -like '*\RDP' }) { $inGroup = $true }
    }
    if ($inGroup) {
      Add-Result "Remote Desktop Users Membership" $true "RDP is member"
    } else {
      Add-Result "Remote Desktop Users Membership" $false "RDP not member or group not found"
    }

    # 5) Firewall rule (use PowerShell API)
    $fwRule = $null
    try {
      $fwRule = Get-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue
    } catch { $fwRule = $null }
    if ($fwRule) {
      Add-Result "Firewall Rule" $true "RDP-Tailscale found"
    } else {
      Add-Result "Firewall Rule" $false "RDP-Tailscale not found"
    }

    # 6) Tailscale IP (env or CLI)
    $tsIP = $env:TAILSCALE_IP
    $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
    if ([string]::IsNullOrWhiteSpace($tsIP) -and (Test-Path $tsExe)) {
      try {
        $ipOut = & $tsExe ip -4 2>$null
        $match = ($ipOut | Select-String -Pattern '\d+\.\d+\.\d+\.\d+' -AllMatches).Matches
        if ($match.Count -gt 0) { $tsIP = $match[0].Value }
      } catch { }
    }
    if ([string]::IsNullOrWhiteSpace($tsIP)) {
      Add-Result "Tailscale IP" $false "TAILSCALE_IP not set and tailscale CLI did not return an IP"
    } else {
      Add-Result "Tailscale IP" $true "IP=$tsIP"
    }

    # 7) RDP port connectivity (localhost)
    $portOk = $false
    try {
      $tcp = New-Object System.Net.Sockets.TcpClient
      $async = $tcp.BeginConnect('127.0.0.1', 3389, $null, $null)
      $wait = $async.AsyncWaitHandle.WaitOne(2000)
      if ($wait -and $tcp.Connected) { $portOk = $true; $tcp.Close() }
    } catch { $portOk = $false }
    if ($portOk) {
      Add-Result "RDP Port" $true "127.0.0.1:3389 is reachable"
    } else {
      Add-Result "RDP Port" $false "127.0.0.1:3389 not reachable"
    }

    # 8) Tailscale status (optional check via CLI presence)
    if (Test-Path $tsExe) {
      try {
        $status = & $tsExe status 2>$null
        if ($status) { Add-Result "Tailscale Status" $true "tailscale status returned"; } else { Add-Result "Tailscale Status" $false "tailscale status empty" }
      } catch { Add-Result "Tailscale Status" $false "tailscale status failed: $_" }
    } else {
      Add-Result "Tailscale Status" $false "tailscale.exe not found"
    }

    # Final summary
    $failed = $results | Where-Object { -not $_.passed }
    Write-Host ""
    Write-Host "=== SUMMARY ==="
    foreach ($r in $results) {
      $mark = if ($r.passed) { 'PASS' } else { 'FAIL' }
      Write-Host ("{0,-35} {1,-6} {2}" -f $r.name, $mark, $r.message)
    }

    $overallPassed = ($failed.Count -eq 0)
    Write-Host ""
    if ($overallPassed) {
      Write-Host "All checks passed ✓"
    } else {
      Write-Host "One or more checks failed ✗"
    }

    # Export JSON summary to GITHUB_OUTPUT for other steps to consume
    $resultsJson = $results | ConvertTo-Json -Compress
    if ($env:GITHUB_OUTPUT) {
      # Write single-line JSON as step output key 'rdp_checks'
      Add-Content -Path $env:GITHUB_OUTPUT -Value ("rdp_checks={0}" -f $resultsJson)
    } else {
      Write-Host "GITHUB_OUTPUT not available; skipping step output export."
    }

    # Exit non-zero if any failed (so job fails)
    if (-not $overallPassed) { exit 1 } else { exit 0 }
