      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "      CONFIGURE CORE RDP SETTINGS"
          Write-Host "======================================"

          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Enable NLA (Network Level Authentication)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 2

          Write-Host "RDP configured successfully."

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "    CREATE RDP USER WITH PASSWORD"
          Write-Host "======================================"

          $username = "rdpuser"
          $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 16 | % {[char]$_})

          # Check if user already exists
          $userExists = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($userExists) {
            Write-Host "User $username already exists. Updating password..."
            $secPassword = ConvertTo-SecureString $password -AsPlainText -Force
            Set-LocalUser -Name $username -Password $secPassword
          } else {
            Write-Host "Creating new user: $username"
            $secPassword = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username `
              -Password $secPassword `
              -FullName "RDP User" `
              -Description "Remote Desktop Protocol User"

            Add-LocalGroupMember -Group "Administrators" -Member $username
          }

          Write-Host "User created/updated successfully."
          Write-Host "Username: $username"
          Write-Host "Password: $password"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          MAINTAIN CONNECTION"
          Write-Host "======================================"

          Write-Host "RDP session is ready and waiting for connection..."
          Write-Host "Connection will be maintained until workflow completes."
          
          # Keep the connection alive
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Connection active - $(Get-Date)"
          }
