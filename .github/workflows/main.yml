name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "         INSTALL TAILSCALE"
          Write-Host "======================================"

          $msi = Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi `
            -UseBasicParsing

          if (-not (Test-Path $msi)) {
            Write-Error "Tailscale MSI gagal didownload."
            exit 1
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Write-Error "Instalasi Tailscale gagal. Exit code: $($process.ExitCode)"
            exit 1
          }

          Write-Host "Tailscale installation completed."

          $paths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tsExe = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $tsExe = $path
              break
            }
          }

          if (-not $tsExe) {
            $command = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($command) {
              $tsExe = $command.Source
            }
          }

          if (-not $tsExe) {
            Write-Error "tailscale.exe masih tidak ditemukan setelah instalasi."
            exit 1
          }

          Write-Host "Tailscale executable: $tsExe"

          & $tsExe version

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "       ESTABLISH TAILSCALE"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret belum tersedia."
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            $command = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($command) {
              $tsExe = $command.Source
            }
          }

          if (-not (Test-Path $tsExe)) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          Write-Host "Using: $tsExe"

          $service = Get-Service `
            -Name Tailscale `
            -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "Tailscale service: $($service.Status)"

            if ($service.Status -ne "Running") {
              Start-Service `
                -Name Tailscale `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 5

              $service.Refresh()

              Write-Host "Tailscale service: $($service.Status)"
            }
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          & $tsExe version

          Write-Host ""
          Write-Host "Connecting..."

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          $output = & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" `
            2>&1

          $exitCode = $LASTEXITCODE

          if ($output) {
            $output | ForEach-Object {
              Write-Host $_
            }
          }

          Write-Host "tailscale up exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "Tailscale gagal terhubung."
            exit 1
          }

          Write-Host "Tailscale up berhasil."

          Write-Host ""
          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null

          for ($i = 1; $i -le 60; $i++) {

            Write-Host "Attempt $i/60"

            try {
              $ipOutput = & $tsExe ip -4 2>&1

              if ($LASTEXITCODE -eq 0 -and $ipOutput) {

                foreach ($line in $ipOutput) {

                  $ip = "$line".Trim()

                  if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') {
                    $tsIP = $ip
                    break
                  }
                }
              }
            }
            catch {
              Write-Host "IP query failed: $($_.Exception.Message)"
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {

            Write-Host ""
            Write-Host "========== TAILSCALE DEBUG =========="

            Write-Host ""
            Write-Host "--- STATUS ---"

            try {
              & $tsExe status
            }
            catch {
              Write-Host $_
            }

            Write-Host ""
            Write-Host "--- NETCHECK ---"

            try {
              & $tsExe netcheck
            }
            catch {
              Write-Host $_
            }

            Write-Host "====================================="

            Write-Error "Tailscale IP tidak berhasil diperoleh."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Tailscale connected successfully."
          Write-Host "IP: $tsIP"
          Write-Host "======================================"

      - name: Verify RDP Port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "          VERIFY RDP PORT"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Write-Error "TAILSCALE_IP tidak tersedia."
            exit 1
          }

          Write-Host "Testing: $env:TAILSCALE_IP`:3389"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($result.TcpTestSucceeded) {
            Write-Host "RDP port 3389 is reachable."
          }
          else {
            Write-Error "RDP port 3389 tidak dapat diakses."
            exit 1
          }

      - name: Final Status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP STATUS"
          Write-Host "======================================"

          $service = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "RDP Service : $($service.Status)"
          }
          else {
            Write-Host "RDP Service : NOT FOUND"
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP Port    : 3389"

          Write-Host "======================================"
          Write-Host "RDP CHECK COMPLETE"
