      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "=== Verifying RDP Accessibility ==="
          
          # Check if RDP service is running
          $rdpService = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($rdpService.Status -ne 'Running') {
            Write-Error "RDP Service (TermService) is not running. Current status: $($rdpService.Status)"
            exit 1
          }
          Write-Host "✓ RDP Service is running"

          # Verify RDP registry settings
          $fDenyTS = (Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -ErrorAction SilentlyContinue).fDenyTSConnections
          if ($fDenyTS -ne 0) {
            Write-Error "Remote Desktop is disabled (fDenyTSConnections=$fDenyTS). Expected 0."
            exit 1
          }
          Write-Host "✓ Remote Desktop is enabled (fDenyTSConnections=0)"

          # Check if RDP user exists and is enabled
          $rdpUser = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue
          if (-not $rdpUser) {
            Write-Error "RDP user account does not exist"
            exit 1
          }
          if ($rdpUser.Enabled -eq $false) {
            Write-Error "RDP user account is disabled"
            exit 1
          }
          Write-Host "✓ RDP user account exists and is enabled"

          # Verify RDP user is in Remote Desktop Users group
          $rdpGroup = Get-LocalGroupMember -Group 'Remote Desktop Users' -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*RDP' }
          if (-not $rdpGroup) {
            Write-Error "RDP user is not a member of Remote Desktop Users group"
            exit 1
          }
          Write-Host "✓ RDP user is in Remote Desktop Users group"

          # Check firewall rule
          $fwRule = netsh advfirewall firewall show rule name="RDP-Tailscale" 2>$null | Select-String "Status"
          if (-not $fwRule) {
            Write-Error "RDP firewall rule 'RDP-Tailscale' not found"
            exit 1
          }
          Write-Host "✓ RDP firewall rule is configured"

          # Verify Tailscale connectivity
          $tsIP = $env:TAILSCALE_IP
          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            Write-Error "Tailscale IP is not set"
            exit 1
          }
          Write-Host "✓ Tailscale IP is configured: $tsIP"

          # Test RDP port connectivity on localhost
          try {
            $socket = New-Object System.Net.Sockets.TcpClient
            $socket.Connect('127.0.0.1', 3389)
            if ($socket.Connected) {
              Write-Host "✓ RDP port 3389 is listening and accessible"
              $socket.Close()
            } else {
              Write-Error "Could not connect to RDP port 3389"
              exit 1
            }
          } catch {
            Write-Error "RDP port 3389 connection test failed: $_"
            exit 1
          }

          Write-Host "=== All RDP accessibility checks passed ==="

      - name: Maintain Connection (Keep-Alive)
        shell: pwsh
        run: |
          Write-Host "=== Starting connection maintenance loop ==="
          Write-Host "This job will remain active for monitoring and remote access."
          Write-Host "You can now connect via RDP using the Tailscale IP provided above."
          Write-Host ""
          
          # Keep the job alive by performing periodic checks
          $maxWaitTime = 120  # minutes
          $checkInterval = 60  # seconds
          $elapsed = 0
          
          while ($elapsed -lt ($maxWaitTime * 60)) {
            # Every 5 minutes, verify services are still running
            if (($elapsed % 300) -eq 0) {
              $rdpService = Get-Service -Name TermService -ErrorAction SilentlyContinue
              $tsStatus = & "$(Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe')" status 2>$null | Select-String "yo@"
              
              if ($rdpService.Status -eq 'Running' -and $tsStatus) {
                $currentTime = Get-Date -Format "HH:mm:ss"
                Write-Host "[$currentTime] ✓ Services healthy - RDP and Tailscale are running"
              } else {
                Write-Host "Warning: Service status check detected an issue. Attempting recovery..."
                if ($rdpService.Status -ne 'Running') {
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
                }
              }
            }
            
            Start-Sleep -Seconds $checkInterval
            $elapsed += $checkInterval
            
            # Optional: Display connection info every 30 seconds
            if (($elapsed % 30) -eq 0) {
              $remainingTime = [math]::Round(($maxWaitTime * 60 - $elapsed) / 60, 1)
              Write-Host "Connection active. Time remaining: $remainingTime minutes"
            }
          }
          
          Write-Host "=== Connection maintenance window completed ==="
          Write-Host "Keep this job open in GitHub Actions to maintain RDP access."
