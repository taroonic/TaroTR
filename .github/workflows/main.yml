      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "       ESTABLISH TAILSCALE"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret belum tersedia."
            exit 1
          }

          # Cari tailscale.exe
          $tsExe = $null

          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $tsExe = $path
              break
            }
          }

          if (-not $tsExe) {
            $cmd = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($cmd) {
              $tsExe = $cmd.Source
            }
          }

          if (-not $tsExe) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          Write-Host "Tailscale executable: $tsExe"

          # Pastikan daemon/service berjalan
          $tsService = Get-Service -Name Tailscale -ErrorAction SilentlyContinue

          if ($tsService) {
            Write-Host "Tailscale service status: $($tsService.Status)"

            if ($tsService.Status -ne "Running") {
              Write-Host "Starting Tailscale service..."

              Start-Service -Name Tailscale -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 5

              $tsService.Refresh()
              Write-Host "Tailscale service status: $($tsService.Status)"
            }
          }
          else {
            Write-Warning "Windows service Tailscale tidak ditemukan."
          }

          # Versi CLI
          Write-Host ""
          Write-Host "Tailscale version:"
          & $tsExe version

          # Login / connect
          Write-Host ""
          Write-Host "Connecting to Tailscale..."

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          $upOutput = & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" 2>&1

          $upExitCode = $LASTEXITCODE

          Write-Host "tailscale up exit code: $upExitCode"

          if ($upOutput) {
            $upOutput | ForEach-Object {
              Write-Host $_
            }
          }

          if ($upExitCode -ne 0) {
            Write-Error "tailscale up gagal."
            exit 1
          }

          # Beri daemon waktu untuk menyelesaikan koneksi
          Write-Host ""
          Write-Host "Waiting for Tailscale connection..."

          $tsIP = $null
          $maxRetries = 30

          for ($i = 1; $i -le $maxRetries; $i++) {

            Write-Host "Attempt $i/$maxRetries..."

            try {
              $ipOutput = & $tsExe ip -4 2>&1

              if ($LASTEXITCODE -eq 0 -and $ipOutput) {

                foreach ($line in $ipOutput) {

                  $lineText = "$line".Trim()

                  if ($lineText -match '^\s*(\d{1,3}\.){3}\d{1,3}\s*$') {
                    $tsIP = $lineText
                    break
                  }
                }
              }
            }
            catch {
              Write-Host "IP query error: $($_.Exception.Message)"
            }

            if ($tsIP) {
              break
            }

            # Tampilkan status untuk debugging
            try {
              $statusOutput = & $tsExe status 2>&1

              if ($statusOutput) {
                Write-Host "Tailscale status:"
                $statusOutput | Select-Object -First 5 | ForEach-Object {
                  Write-Host "  $_"
                }
              }
            }
            catch {
              Write-Host "Unable to read Tailscale status."
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            Write-Host ""
            Write-Host "======================================"
            Write-Host "TAILSCALE DEBUG INFORMATION"
            Write-Host "======================================"

            try {
              & $tsExe status
            }
            catch {
              Write-Host "status failed: $($_.Exception.Message)"
            }

            try {
              & $tsExe netcheck
            }
            catch {
              Write-Host "netcheck failed: $($_.Exception.Message)"
            }

            Write-Host "======================================"

            Write-Error "Tailscale IP tidak berhasil diperoleh."
            exit 1
          }

          # Simpan untuk step berikutnya
          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Tailscale connection established."
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "======================================"
