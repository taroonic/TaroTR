name: RDP

on:
  workflow_dispatch:

jobs:
  rdp-check:
    runs-on: windows-latest

    steps:
      - name: Verify RDP and Tailscale
        shell: pwsh
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "======================================"
          Write-Host "       RDP + TAILSCALE CHECK"
          Write-Host "======================================"
          Write-Host ""

          $results = [System.Collections.Generic.List[object]]::new()

          function Add-Result {
            param(
              [string]$Name,
              [bool]$Passed,
              [string]$Message
            )

            $results.Add([PSCustomObject]@{
              name    = $Name
              passed  = $Passed
              message = $Message
            })

            if ($Passed) {
              Write-Host "[PASS] $Name - $Message"
            }
            else {
              Write-Host "[FAIL] $Name - $Message"
            }
          }

          # ==========================================
          # 1. RDP SERVICE
          # ==========================================
          try {
            $service = Get-Service -Name TermService -ErrorAction Stop

            if ($service.Status -eq "Running") {
              Add-Result "RDP Service" $true "TermService is Running"
            }
            else {
              Add-Result "RDP Service" $false "Status: $($service.Status)"
            }
          }
          catch {
            Add-Result "RDP Service" $false "TermService tidak ditemukan"
          }

          # ==========================================
          # 2. RDP REGISTRY
          # ==========================================
          try {
            $reg = Get-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -ErrorAction Stop

            if ($reg.fDenyTSConnections -eq 0) {
              Add-Result "RDP Registry" $true "fDenyTSConnections=0"
            }
            else {
              Add-Result "RDP Registry" $false "fDenyTSConnections=$($reg.fDenyTSConnections)"
            }
          }
          catch {
            Add-Result "RDP Registry" $false "Registry check failed"
          }

          # ==========================================
          # 3. RDP USER
          # ==========================================
          try {
            $rdpUser = Get-LocalUser -Name "RDP" -ErrorAction Stop

            if ($rdpUser.Enabled) {
              Add-Result "RDP User" $true "RDP account exists and enabled"
            }
            else {
              Add-Result "RDP User" $false "RDP account disabled"
            }
          }
          catch {
            Add-Result "RDP User" $false "RDP account not found"
          }

          # ==========================================
          # 4. REMOTE DESKTOP USERS
          # ==========================================
          try {
            $members = Get-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -ErrorAction Stop

            $member = $members | Where-Object {
              $_.Name -eq "RDP" -or $_.Name -like "*\RDP"
            }

            if ($member) {
              Add-Result "RDP Group" $true "RDP is member of Remote Desktop Users"
            }
            else {
              Add-Result "RDP Group" $false "RDP is not a member"
            }
          }
          catch {
            Add-Result "RDP Group" $false "Could not check Remote Desktop Users"
          }

          # ==========================================
          # 5. FIREWALL
          # ==========================================
          try {
            $fw = Get-NetFirewallRule `
              -DisplayName "RDP-Tailscale" `
              -ErrorAction SilentlyContinue

            if ($fw) {
              $enabled = $fw | Where-Object {
                $_.Enabled -eq "True"
              }

              if ($enabled) {
                Add-Result "Firewall" $true "RDP-Tailscale enabled"
              }
              else {
                Add-Result "Firewall" $false "RDP-Tailscale disabled"
              }
            }
            else {
              Add-Result "Firewall" $false "RDP-Tailscale rule not found"
            }
          }
          catch {
            Add-Result "Firewall" $false "Firewall check failed"
          }

          # ==========================================
          # 6. FIND TAILSCALE
          # ==========================================
          $tsExe = $null

          $paths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $tsExe = $path
              break
            }
          }

          if (-not $tsExe) {
            $command = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($command) {
              $tsExe = $command.Source
            }
          }

          if ($tsExe) {
            Add-Result "Tailscale CLI" $true "Found: $tsExe"
          }
          else {
            Add-Result "Tailscale CLI" $false "tailscale.exe not found"
          }

          # ==========================================
          # 7. TAILSCALE IP
          # ==========================================
          $tsIP = $env:TAILSCALE_IP

          if ($tsExe -and [string]::IsNullOrWhiteSpace($tsIP)) {
            try {
              $ipOutput = & $tsExe ip -4 2>$null

              foreach ($line in $ipOutput) {
                if ($line -match '\b100\.(?:\d{1,3}\.){2}\d{1,3}\b') {
                  $tsIP = $Matches[0]
                  break
                }
              }
            }
            catch {
              Write-Host "Unable to read Tailscale IP"
            }
          }

          if ($tsIP) {
            Add-Result "Tailscale IP" $true "IP=$tsIP"
          }
          else {
            Add-Result "Tailscale IP" $false "Tailscale IP unavailable"
          }

          # ==========================================
          # 8. TAILSCALE STATUS
          # ==========================================
          if ($tsExe) {
            try {
              $status = & $tsExe status 2>&1

              if ($LASTEXITCODE -eq 0 -and $status) {
                Add-Result "Tailscale Status" $true "Tailscale status OK"
              }
              else {
                Add-Result "Tailscale Status" $false "Tailscale status failed"
              }
            }
            catch {
              Add-Result "Tailscale Status" $false "Tailscale status error"
            }
          }
          else {
            Add-Result "Tailscale Status" $false "tailscale.exe unavailable"
          }

          # ==========================================
          # 9. LOCAL RDP PORT
          # ==========================================
          try {
            $localTest = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 3389 `
              -WarningAction SilentlyContinue

            if ($localTest.TcpTestSucceeded) {
              Add-Result "Local RDP Port" $true "127.0.0.1:3389 reachable"
            }
            else {
              Add-Result "Local RDP Port" $false "127.0.0.1:3389 unreachable"
            }
          }
          catch {
            Add-Result "Local RDP Port" $false "Port test failed"
          }

          # ==========================================
          # 10. TAILSCALE RDP PORT
          # ==========================================
          if ($tsIP) {
            try {
              $remoteTest = Test-NetConnection `
                -ComputerName $tsIP `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if ($remoteTest.TcpTestSucceeded) {
                Add-Result "Tailscale RDP Port" $true "$tsIP:3389 reachable"
              }
              else {
                Add-Result "Tailscale RDP Port" $false "$tsIP:3389 unreachable"
              }
            }
            catch {
              Add-Result "Tailscale RDP Port" $false "Tailscale port test failed"
            }
          }
          else {
            Add-Result "Tailscale RDP Port" $false "Skipped: no Tailscale IP"
          }

          # ==========================================
          # SUMMARY
          # ==========================================
          Write-Host ""
          Write-Host "======================================"
          Write-Host "              SUMMARY"
          Write-Host "======================================"

          foreach ($result in $results) {
            $status = if ($result.passed) {
              "PASS"
            }
            else {
              "FAIL"
            }

            Write-Host (
              "{0,-28} {1,-6} {2}" -f `
              $result.name,
              $status,
              $result.message
            )
          }

          Write-Host "======================================"

          # ==========================================
          # GITHUB OUTPUT
          # ==========================================
          if ($env:GITHUB_OUTPUT) {
            $json = @($results) | ConvertTo-Json -Compress

            Add-Content `
              -Path $env:GITHUB_OUTPUT `
              -Value "rdp_checks=$json"
          }

          # ==========================================
          # FINAL RESULT
          # ==========================================
          $failed = @(
            $results | Where-Object {
              -not $_.passed
            }
          )

          Write-Host ""
          Write-Host "Total checks : $($results.Count)"
          Write-Host "Failed checks: $($failed.Count)"

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "RDP CHECK FAILED"
            exit 1
          }

          Write-Host ""
          Write-Host "ALL RDP CHECKS PASSED"
          exit 0
