name: TaroTR

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tarotr:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host " TaroTR Windows Runner"
          Write-Host "================================"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Check Project
        shell: powershell
        run: |
          Write-Host "Project files:"
          Get-ChildItem -Force

          if (-not (Test-Path "package.json")) {
            Write-Host "package.json tidak ditemukan."
            Write-Host "Node.js build akan dilewati."
          } else {
            Write-Host "package.json ditemukan."
          }

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: powershell
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

      - name: Build TaroTR
        if: ${{ hashFiles('package.json') != '' }}
        shell: powershell
        run: |
          $scripts = npm run

          if ($scripts -match "build") {
            npm run build
          } else {
            Write-Host "Script build tidak tersedia."
            Write-Host "Build dilewati."
          }

      - name: Test TaroTR
        if: ${{ hashFiles('package.json') != '' }}
        shell: powershell
        run: |
          $scripts = npm run

          if ($scripts -match "test") {
            npm test --if-present
          } else {
            Write-Host "Script test tidak tersedia."
            Write-Host "Test dilewati."
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "Gagal mengunduh Tailscale."
            exit 1
          }

          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe `
            -ArgumentList "/i", $installer, "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            Write-Error "Tailscale tidak ditemukan."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "Secret TAILSCALE_AUTH_KEY belum dibuat."
            exit 1
          }

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="tarotr-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale gagal terhubung."
            exit 1
          }

      - name: Show Tailscale Address
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Tailscale address tidak ditemukan."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " TaroTR Tailscale Address: $ip"
          Write-Host "=========================================="

      - name: Show Tailscale Status
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $ts status

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaroTR-build
          path: |
            dist/**
            build/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Finish
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================"
          Write-Host " TaroTR workflow selesai."
          Write-Host "================================"
