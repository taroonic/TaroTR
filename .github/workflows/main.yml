# ==========================================
# AUTOMATIC RDP CONNECTION
# ==========================================

$Server   = "100.73.36.38"
$Username = "RDP"
$Password = 'wP9#vL4$gT7!sQ2@dH6rXz1K'

$RdpFile = Join-Path $env:TEMP "Tailscale-RDP.rdp"
$Target  = "TERMSRV/$Server"

Write-Host "=========================================="
Write-Host "        TAILSCALE RDP CONNECTION"
Write-Host "=========================================="
Write-Host "Server  : $Server"
Write-Host "User    : $Username"
Write-Host "Password: [HIDDEN]"
Write-Host ""

# Simpan kredensial ke Windows Credential Manager
cmdkey /generic:$Target /user:$Username /pass:$Password | Out-Null

# Buat konfigurasi RDP
$RdpConfig = @"
full address:s:$Server
username:s:$Username
screen mode id:i:2
desktopwidth:i:1920
desktopheight:i:1080
session bpp:i:32
prompt for credentials:i:0
authentication level:i:2
enablecredsspsupport:i:1
redirectclipboard:i:1
redirectprinters:i:0
redirectdrives:i:0
audiomode:i:0
compression:i:1
autoreconnection enabled:i:1
networkautodetect:i:1
bandwidthautodetect:i:1
"@

Set-Content `
    -Path $RdpFile `
    -Value $RdpConfig `
    -Encoding ASCII

Write-Host "RDP file dibuat:"
Write-Host $RdpFile
Write-Host ""

# Pastikan Remote Desktop Client tersedia
$Mstsc = "$env:SystemRoot\System32\mstsc.exe"

if (-not (Test-Path $Mstsc)) {
    Write-Error "mstsc.exe tidak ditemukan."
    exit 1
}

# Tes koneksi TCP terlebih dahulu
Write-Host "Testing $Server`:3389 ..."

$Test = Test-NetConnection `
    -ComputerName $Server `
    -Port 3389 `
    -WarningAction SilentlyContinue

if (-not $Test.TcpTestSucceeded) {
    Write-Host ""
    Write-Host "Koneksi ke $Server`:3389 gagal."
    Write-Host "Pastikan Tailscale aktif dan RDP pada PC tujuan berjalan."
    exit 1
}

Write-Host "TCP connection berhasil."
Write-Host ""
Write-Host "Membuka Remote Desktop..."

# Buka RDP
Start-Process `
    -FilePath $Mstsc `
    -ArgumentList "`"$RdpFile`""

Write-Host ""
Write-Host "=========================================="
Write-Host "             RDP STARTED"
Write-Host "=========================================="
Write-Host "Server  : $Server"
Write-Host "Username: $Username"
Write-Host "=========================================="
