name: RDP

on:
  workflow_dispatch:

jobs:
  rdp-check:
    runs-on: windows-latest

    steps:
      - name: Check RDP Service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== RDP SERVICE ==="

          $service = Get-Service -Name TermService -ErrorAction SilentlyContinue

          if (-not $service) {
            Write-Error "TermService tidak ditemukan."
            exit 1
          }

          Write-Host "Status: $($service.Status)"

          if ($service.Status -ne 'Running') {
            Write-Error "RDP service tidak sedang berjalan."
            exit 1
          }

          Write-Host "RDP service OK."

      - name: Check RDP Registry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== RDP REGISTRY ==="

          $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'

          $reg = Get-ItemProperty `
            -Path $path `
            -Name fDenyTSConnections `
            -ErrorAction Stop

          Write-Host "fDenyTSConnections: $($reg.fDenyTSConnections)"

          if ($reg.fDenyTSConnections -ne 0) {
            Write-Error "RDP dinonaktifkan pada registry."
            exit 1
          }

          Write-Host "RDP registry OK."

      - name: Check RDP Port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== RDP PORT 3389 ==="

          $result = Test-NetConnection `
            -ComputerName '127.0.0.1' `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "Port 3389 tidak dapat diakses."
            exit 1
          }

          Write-Host "127.0.0.1:3389 OK."

      - name: Check Tailscale
        shell: pwsh
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== TAILSCALE CHECK ==="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Write-Error "Secret TAILSCALE_IP belum dibuat."
            exit 1
          }

          Write-Host "Testing Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "TCP $env:TAILSCALE_IP`:3389 gagal."
            exit 1
          }

          Write-Host "Tailscale RDP connectivity OK."

      - name: Check Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== FIREWALL ==="

          $rules = Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object {
              $_.DisplayGroup -match 'Remote Desktop' -and
              $_.Enabled -eq 'True'
            }

          if ($rules) {
            Write-Host "Remote Desktop firewall rules ditemukan dan aktif."
          }
          else {
            Write-Warning "Tidak ditemukan firewall rule Remote Desktop yang aktif."
          }

      - name: Final RDP Report
        shell: pwsh
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP CHECK COMPLETE"
          Write-Host "======================================"
          Write-Host "RDP Service : OK"
          Write-Host "RDP Registry: OK"
          Write-Host "RDP Port    : 3389"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Semua pemeriksaan utama berhasil."
