name: RDP

on:
  workflow_dispatch:

concurrency:
  group: rdp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep runner
        id: prep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Windows runner ready"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Install Tailscale if missing
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsPath = $null

          $command = Get-Command tailscale -ErrorAction SilentlyContinue
          if ($command) {
            $tsPath = $command.Source
          }

          if (-not $tsPath) {
            $candidates = @(
              (Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'),
              (Join-Path $env:ProgramFiles 'Tailscale\Tailscale.exe')
            )

            if (${env:ProgramFiles(x86)}) {
              $candidates += Join-Path ${env:ProgramFiles(x86)} 'Tailscale\tailscale.exe'
            }

            $tsPath = $candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if ($tsPath) {
            Write-Host "Tailscale already installed at: $tsPath"
            exit 0
          }

          $msiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup.msi"
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          $maxAttempts = 3

          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              Write-Host "Downloading Tailscale MSI - attempt $i"

              Invoke-WebRequest `
                -Uri $msiUrl `
                -OutFile $installer

              if (Test-Path $installer) {
                break
              }

              throw "Installer tidak ditemukan setelah download."
            }
            catch {
              if ($i -eq $maxAttempts) {
                throw "Gagal download Tailscale MSI setelah $maxAttempts percobaan: $($_.Exception.Message)"
              }

              $delay = 5 * $i
              Write-Host "Download gagal. Retry dalam $delay detik..."
              Start-Sleep -Seconds $delay
            }
          }

          if (-not (Test-Path $installer)) {
            throw "Tailscale installer gagal di-download."
          }

          Write-Host "Installing Tailscale..."

          $proc = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              $installer,
              "/quiet",
              "/norestart"
            ) `
            -Wait `
            -NoNewWindow `
            -PassThru

          if ($proc.ExitCode -ne 0) {
            throw "Instalasi Tailscale gagal. Exit code: $($proc.ExitCode)"
          }

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed successfully."

      - name: Ensure Tailscale service running
        id: ensure_service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $serviceNames = @(
            "Tailscale",
            "TailscaleService"
          )

          $service = $null

          foreach ($name in $serviceNames) {
            $found = Get-Service `
              -Name $name `
              -ErrorAction SilentlyContinue

            if ($found) {
              $service = $found
              break
            }
          }

          if ($null -eq $service) {
            Write-Host "Tailscale service tidak ditemukan."
            Write-Host "Lanjutkan ke tahap berikutnya."
            exit 0
          }

          if ($service.Status -ne "Running") {
            Write-Host "Starting service: $($service.Name)"

            Start-Service -Name $service.Name

            $service.WaitForStatus(
              "Running",
              [TimeSpan]::FromSeconds(30)
            )
          }

          Write-Host "Service: $($service.Name)"
          Write-Host "Status : $($service.Status)"

      - name: Locate Tailscale
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsExe = $null

          $command = Get-Command tailscale -ErrorAction SilentlyContinue

          if ($command) {
            $tsExe = $command.Source
          }

          if (-not $tsExe) {
            $candidates = @(
              (Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'),
              (Join-Path $env:ProgramFiles 'Tailscale\Tailscale.exe')
            )

            if (${env:ProgramFiles(x86)}) {
              $candidates += Join-Path ${env:ProgramFiles(x86)} 'Tailscale\tailscale.exe'
            }

            $tsExe = $candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $tsExe) {
            throw "Tailscale executable tidak ditemukan."
          }

          Write-Host "Tailscale executable:"
          Write-Host $tsExe

          "ts_exe=$tsExe" >> $env:GITHUB_OUTPUT

      - name: Connect to Tailscale
        id: connect
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Secret TAILSCALE_AUTH_KEY belum dibuat."
          }

          $tsExe = "${{ steps.locate.outputs.ts_exe }}"

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable tidak ditemukan: $tsExe"
          }

          Write-Host "Connecting to Tailscale..."

          & $tsExe up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --accept-routes=false

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale gagal terhubung. Exit code: $LASTEXITCODE"
          }

          Start-Sleep -Seconds 3

      - name: Get Tailscale IPv4
        id: get_ip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsExe = "${{ steps.locate.outputs.ts_exe }}"

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable tidak ditemukan."
          }

          $ip = (& $tsExe ip -4 2>$null).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IPv4 tidak tersedia."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " TAILSCALE ADDRESS: $ip"
          Write-Host "=========================================="

          "tailscale_ip=$ip" >> $env:GITHUB_OUTPUT

      - name: Show Tailscale Status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $tsExe = "${{ steps.locate.outputs.ts_exe }}"

          if (Test-Path $tsExe) {
            & $tsExe status
          }
          else {
            Write-Host "Tailscale executable tidak ditemukan."
          }

      - name: Disconnect Tailscale
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $tsExe = "${{ steps.locate.outputs.ts_exe }}"

          if ($tsExe -and (Test-Path $tsExe)) {
            Write-Host "Disconnecting Tailscale..."
            & $tsExe down
          }
          else {
            Write-Host "Tailscale tidak ditemukan. Cleanup dilewati."
          }

      - name: Finish
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Workflow RDP selesai."
