name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Windows
        shell: powershell
        run: |
          Write-Host "Windows runner ready"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "Tailscale installer gagal di-download."
          }

          Write-Host "Installing Tailscale..."
          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Instalasi Tailscale gagal. Exit code: $($process.ExitCode)"
          }

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale tidak ditemukan."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Secret TAILSCALE_AUTH_KEY belum dibuat."
          }

          Write-Host "Connecting to Tailscale..."

          & $ts up --authkey="$env:TAILSCALE_AUTH_KEY"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale gagal terhubung. Periksa TAILSCALE_AUTH_KEY."
          }

      - name: Get Address
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IP tidak ditemukan."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " TAILSCALE ADDRESS"
          Write-Host " $ip"
          Write-Host "=========================================="

      - name: Show Status
        shell: powershell
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $ts status

      - name: Finish
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Workflow RDP selesai."
