```yaml
name: TaroTR

on:
  workflow_dispatch:

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout TaroTR
        uses: actions/checkout@v4

      - name: System Information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "          TaroTR Windows Runner"
          Write-Host "======================================"
          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "Runner ID: $env:GITHUB_RUN_ID"
          Write-Host "OS       : $([System.Environment]::OSVersion.Version)"
          Write-Host "======================================"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY belum diset di GitHub Secrets."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale tidak ditemukan."
          }

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="tarotr-$env:GITHUB_RUN_ID"

      - name: Show Tailscale Address
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $ip = & $ts ip -4

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Alamat Tailscale tidak ditemukan."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "          TAROTR ADDRESS"
          Write-Host "======================================"
          Write-Host "Tailscale IPv4 : $ip"
          Write-Host "Hostname       : tarotr-$env:GITHUB_RUN_ID"
          Write-Host "======================================"
```
