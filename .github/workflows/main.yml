name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CONFIGURE CORE RDP SETTINGS
      # ============================================================
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "     CONFIGURE CORE RDP SETTINGS"
          Write-Host "======================================"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # Start Remote Desktop service
          Set-Service -Name TermService -StartupType Automatic

          Start-Service -Name TermService -ErrorAction SilentlyContinue

          # Enable built-in RDP firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop configured."

      # ============================================================
      # 2. CREATE RDP USER WITH SECURE PASSWORD
      # ============================================================
      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          RDP_USERNAME: RDP
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "     CREATE RDP USER"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD secret belum dibuat."
            exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($user) {
            Write-Host "User RDP sudah ada. Memperbarui password."

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -ErrorAction Stop
          }
          else {
            Write-Host "Membuat user RDP..."

            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "RDP account" `
              -ErrorAction Stop
          }

          Enable-LocalUser -Name $env:RDP_USERNAME

          # Tambahkan ke Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user berhasil dikonfigurasi."
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: [HIDDEN]"

      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "======================================"
          Write-Host "        INSTALL TAILSCALE"
          Write-Host "======================================"

          $msi = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi `
            -UseBasicParsing

          if (-not (Test-Path $msi)) {
            Write-Error "Tailscale MSI gagal didownload."
            exit 1
          }

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Write-Error "Instalasi Tailscale gagal. Exit code: $($process.ExitCode)"
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            $cmd = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($cmd) {
              $tsExe = $cmd.Source
            }
          }

          if (-not (Test-Path $tsExe)) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          "TAILSCALE_EXE=$tsExe" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale installed:"
          Write-Host $tsExe

          & $tsExe version

      # ============================================================
      # 4. ESTABLISH TAILSCALE CONNECTION
      # ============================================================
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "    ESTABLISH TAILSCALE CONNECTION"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret belum dibuat."
            exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          $service = Get-Service `
            -Name Tailscale `
            -ErrorAction SilentlyContinue

          if ($service -and $service.Status -ne "Running") {
            Start-Service -Name Tailscale
            Start-Sleep -Seconds 5
          }

          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          Write-Host "Connecting to Tailscale..."

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale gagal terhubung."
            exit 1
          }

          $tsIP = $null

          for ($i = 1; $i -le 60; $i++) {
            Write-Host "Waiting for Tailscale IP... $i/60"

            $output = & $tsExe ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $output) {
              foreach ($line in $output) {
                $candidate = "$line".Trim()

                if ($candidate -match '^100\.(\d{1,3}\.){2}\d{1,3}$') {
                  $tsIP = $candidate
                  break
                }
              }
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            Write-Host "========== TAILSCALE STATUS =========="
            & $tsExe status
            Write-Host "======================================"

            Write-Error "Tailscale IP tidak berhasil diperoleh."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tsIP"

      # ============================================================
      # 5. VERIFY RDP ACCESSIBILITY
      # ============================================================
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "======================================"
          Write-Host "      VERIFY RDP ACCESSIBILITY"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Write-Error "TAILSCALE_IP tidak tersedia."
            exit 1
          }

          $service = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if (-not $service -or $service.Status -ne "Running") {
            Write-Error "Remote Desktop service tidak berjalan."
            exit 1
          }

          $reg = Get-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -ErrorAction Stop

          if ($reg.fDenyTSConnections -ne 0) {
            Write-Error "Remote Desktop masih disabled."
            exit 1
          }

          Write-Host "Testing local RDP port..."

          $local = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $local.TcpTestSucceeded) {
            Write-Error "Local RDP port 3389 tidak terbuka."
            exit 1
          }

          Write-Host "Testing Tailscale RDP port..."
          Write-Host "$env:TAILSCALE_IP`:3389"

          $remote = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $remote.TcpTestSucceeded) {
            Write-Error "RDP melalui Tailscale tidak dapat diakses."
            exit 1
          }

          Write-Host ""
          Write-Host "RDP accessibility check PASSED."

      # ============================================================
      # 6. FINAL STATUS
      # ============================================================
      - name: Final Status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             RDP STATUS"
          Write-Host "======================================"

          $service = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          Write-Host "RDP Service : $($service.Status)"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP Port    : 3389"
          Write-Host "Username    : RDP"
          Write-Host "Password    : [HIDDEN]"

          Write-Host "======================================"
          Write-Host "RDP CHECK COMPLETE"

      # ============================================================
      # 7. MAINTAIN CONNECTION
      # ============================================================
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP ACCESS ACTIVE"
          Write-Host "======================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "User    : RDP"
          Write-Host "Password: [HIDDEN]"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Runner akan tetap aktif sampai workflow dibatalkan."

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
            Start-Sleep -Seconds 300
          }
